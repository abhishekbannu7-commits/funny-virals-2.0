[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/api/version"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/Zoro.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Zoro.apk\""

