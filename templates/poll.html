<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Funny Virals 2.0 - Poll</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
width:1080px;
height:1350px;
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}

.slide{
width:1080px;
height:1350px;
padding:80px;
display:flex;
flex-direction:column;
}

.logo img{
height:90px;
}

.category{
color:#ff2e88;
font-size:32px;
font-weight:bold;
margin:30px 0;
text-transform:uppercase;
}

.question{
font-size:72px;
font-weight:900;
line-height:1.1;
margin-bottom:60px;
}

.option{
border:3px solid #ff2e88;
border-radius:30px;
padding:28px;
font-size:42px;
margin-bottom:25px;
}

.footer{
margin-top:auto;
text-align:center;
}

.cta{
font-size:42px;
font-weight:bold;
color:#ff2e88;
}

.handle{
margin-top:15px;
font-size:28px;
color:#999;
}
</style>

</head>

<body>

<div class="slide">

<div class="logo">
<img src="{{logo}}">
</div>

<div class="category">{{category}}</div>

<div class="question">{{question}}</div>

<div class="option">① {{option1}}</div>

<div class="option">② {{option2}}</div>

<div class="option">③ {{option3}}</div>

<div class="option">④ {{option4}}</div>

<div class="footer">
<div class="cta">{{cta}}</div>
<div class="handle">{{instagram}}</div>
</div>

</div>

</body>
</html>
