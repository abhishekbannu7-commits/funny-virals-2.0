<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
width:1080px;
height:1350px;
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}
.slide{
width:100%;
height:100%;
padding:70px;
display:flex;
flex-direction:column;
justify-content:space-between;
}
.logo img{
height:80px;
display:block;
margin:auto;
}
.badge{
display:inline-block;
background:#ff2d7a;
padding:10px 24px;
border-radius:30px;
font-size:28px;
font-weight:bold;
margin:auto;
}
.question{
flex:1;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:72px;
font-weight:900;
line-height:1.15;
padding:30px;
}
.question span{
color:#ff2d7a;
}
.footer{
border-top:2px solid rgba(255,45,122,.25);
padding-top:25px;
text-align:center;
}
.cta{
font-size:42px;
font-weight:bold;
color:#ff2d7a;
}
.handle{
margin-top:10px;
font-size:24px;
color:#888;
}
</style>
</head>

<body>

<div class="slide">

<div class="logo">
<img src="{{logo}}">
</div>

<div class="badge">
{{category}}
</div>

<div class="question">
{{question}}
</div>

<div class="footer">
<div class="cta">{{cta}}</div>
<div class="handle">{{instagram}}</div>
</div>

</div>

</body>
</html>
